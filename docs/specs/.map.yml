# docs/specs/.map.yml — capability → source map for the /specs skill.
# HAND-EDITABLE: this is the only human-owned file in docs/specs/.
# Spec bodies (<area>.md) are generated by /specs regen — don't hand-edit those.
#
# Granularity: one area = one capability a consumer would recognize
# (task-tracking, feature-lifecycle, spec-harvesting), not one file.
# Healthy: ~5-20 areas.
#
# Discovered 2026-09-01 by /specs init (TASK-079), replacing the empty seed that had
# stood since 2026-08-18. 16 areas over 63 tracked files.
#
# WHY THESE AREAS: the product is 18 skills, and one area per skill would be the wrong
# shape and roughly the wrong count. These are grouped by the capability a consumer
# installs them FOR — the two front doors are one area and the two testing skills are one,
# while `tasks` and `feature` are large enough to stand alone.
#
# NAMED FROM THE OUTSIDE IN, after a cold read said the first draft was not. A reader given
# only the names called four of them internal groupings — they named the authors' file
# layout ("cross-tree"), a circumstance rather than a capability ("review-gate-fallbacks"),
# an author-side metaphor ("spec-harvesting"), and an ambiguous subject ("skill-set-
# validation": whose skills?). One name carried an "and" that turned out to be two separate
# skills stapled together, and it was split. Titles were rewritten too: they leaned on
# definite articles for terms the reader had not met ("THE universal project layer"), which
# is the clearest symptom of naming from the inside out.
#
# SECOND PASS 2026-09-02 (TASK-103), after a second cold read of the revised list. The rule
# both reads support: a clean name names the OBJECT you act on, an opaque one names the
# PROPERTY you check — specs, tests, a changelog and a session read clean, while
# conformance, verification and reporting did not. So `convention-conformance` →
# `rulebook-check`, `intent-verification` → `acceptance-check` (a reader had guessed it
# meant *inferring what code intends to do*, which is worse than opacity),
# `project-scaffolding` → `project-baseline` (everywhere else "scaffolding" promises source
# code, and this ships docs), `skill-contract-lint` → `skill-authoring-rules`, and
# `vocabulary-and-decision-records` → `glossary-and-adrs`. Where several areas share a verb,
# each is now named by what it checks AGAINST — the rulebook, the acceptance criteria,
# correctness, the skill schema — because that is a reader's only discriminator.
#
# `roadmap` was KEPT against the second reader's objection: the first proposed that exact
# word, and a name changed on one reader's taste where another disagreed is not an
# improvement. Its title was the real fault and was rewritten.

# The scan set — tracked files left after `ignore` — was 63 of the 221 below. That number
# is deliberately NOT a key: the contract defines three coverage keys and no more, and a
# second number beside the tree size reads as a coverage fraction, which it is not.
coverage: verified
tracked-files-at-scan: 221
# Unmapped at first scan because the seed ignored `.github/**` wholesale. 548 lines of
# executable shell, five checks, 43 test cases — the only executable behaviour in the repo —
# so the ignore was narrowed to `ci.yml` alone and these were folded into an area. Drift
# (behaviour the map could not see), not housekeeping sent to `ignore`.
coverage-drift:
  - ".github/workflows/skills-lint.sh"
  - ".github/workflows/skills-lint-test.sh"

# THE FOUR CHECKING AREAS CANNOT BE SORTED BY NAME, AND THAT IS RECORDED RATHER THAN FIXED.
# Three independent cold reads each tried; the best score was two of four. Every read reached
# the same diagnosis, in its own words: the four differ by WHAT THEY CHECK AGAINST — this
# project's own written rules, the task's acceptance criteria, correctness, the skill schema —
# and a reader holding only names has no way to recover which is which. Naming them by their
# reference (`project-rules-check`, `intent-and-scope-check`, `code-and-security-review`,
# `skill-authoring-rules`) is as far as naming reaches; the titles carry the rest.
#
# The residue is a PRODUCT boundary, not a naming one: a skill set with four review passes a
# user cannot tell apart has drawn that boundary faintly, and no rename repairs it. Recorded
# here so the next person edits the product or accepts the cost, rather than trying a fourth
# round of words. TASK-103 holds the evidence.

areas:
  - name: work-tracking
    title: The developer-facing backlog — epics, stories and tasks, with a gate before done
    sources:
      - "skills/tasks/**"

  - name: feature-lifecycle
    title: The stakeholder-facing half — an idea to shipped, with every decision recorded
    sources:
      - "skills/feature/**"

  - name: project-baseline
    title: Giving any repo the same baseline of docs and tracking, new or existing
    sources:
      - "skills/new-project/**"
      - "skills/adopt-project/**"

  - name: specs-from-code
    title: Specifications generated from the code itself, so they cannot silently go stale
    sources:
      - "skills/specs/**"

  - name: defect-draining
    title: Working a filed review backlog down, one defect per run, without supervision
    sources:
      - "skills/fix-next/**"

  - name: project-rules-check
    # "Whose rules" was the missing word: a reader's first guess was the library's own house
    # rules rather than the consuming project's, which is the opposite audience.
    title: Checking a change against the rules this project itself wrote down
    sources:
      - "skills/verify-conventions/**"

  - name: intent-and-scope-check
    # Third rename of this area, and the first proposed by the reader who misread the second.
    # `intent-verification` was opaque; `acceptance-check` was worse — confidently misread as
    # acceptance/UAT testing, because "acceptance" carries a test-execution smell and says
    # nothing about scope. The scope half ("nothing extra") is the more distinctive thing this
    # area does and both earlier names hid it. This name carries both halves.
    title: Checking a change against the task's acceptance criteria — built, and nothing extra
    sources:
      - "skills/verify-intent/**"

  - name: code-and-security-review
    title: Reviewing a change for correctness bugs, and for security when it touches one
    # Kept separate from rulebook-check and acceptance-check, deliberately: these three are
    # frozen fallbacks that exist in ONE runtime only — Claude Code ships them natively, so
    # installing copies would shadow the natives (ADR 0010). A consumer's answer to "what
    # reviews my code" therefore differs by runtime, which is a capability boundary, not a
    # packaging detail. Folding them in would make one spec describe two runtimes at once.
    sources:
      - "skills-pi/**"

  - name: test-authoring
    title: Writing tests first, filling coverage gaps, and proving a test can actually fail
    sources:
      - "skills/tdd/**"
      - "skills/populate-tests/**"

  - name: glossary-and-adrs
    # The "and" reflects the skill's own scope, not a filing decision: one skill owns both
    # halves, so no split is available to this map. Both cold reads called the pairing a
    # grouping, and both were right about the product rather than about this file.
    title: Fixing what each term means, and recording why a hard choice was made
    sources:
      - "skills/domain/**"

  - name: project-roadmap
    # Kept the word, added the possessive, after the tiebreak flipped. One reader proposed `roadmap`;
    # two then objected on DIFFERENT grounds — "promises a timeline, delivers a drift report", and
    # "a library's roadmap is its own future… nothing says it operates on MY repo's data". The second
    # objection is the one a prospective installer hits first, and one word answers it.
    title: One place to see every feature and every task in your project, and where the two have drifted
    sources:
      - "skills/roadmap/**"

  - name: changelog-maintenance
    title: Turning shipped work into a changelog a human would want to read
    sources:
      - "skills/roll-changelog/**"

  - name: idea-interrogation
    # Both cold reads took this for the opening phase of feature-lifecycle. It is usable on any plan,
    # standing alone, and the title now says so rather than leaving the reader to assume containment.
    title: Interrogating any plan — feature or not — until every unresolved branch is decided
    sources:
      - "skills/grill-me/**"

  - name: session-handoff
    title: Compacting a working session into something another agent can continue from
    sources:
      - "skills/handoff/**"

  - name: installation
    # Not a capability, and the map says so rather than pretending: a reader called it "a README section",
    # correctly. It is here because the four install scripts ARE behaviour — link rather than copy, one
    # junction per folder, re-run required when a skill folder is added — and a map must cover behaviour.
    # Not every behaviour is a capability. `pi` is an in-house agent runtime; a reader who does not know
    # it should not have to guess, so the title names both targets plainly.
    title: Installing the skills into an agent runtime — Claude Code, or the in-house pi runtime
    sources:
      - "install.sh"
      - "install.ps1"
      - "pi-install.sh"
      - "pi-install.ps1"

  - name: skill-authoring-rules
    # Consumer-facing because a consuming repo may ship its own project-local skill that
    # shadows one of these — the contract is what such a skill must satisfy. Two cold reads
    # both took the name as maintainer-only, so the title now says the audience outright.
    title: If you write your own skill, the shape it must have — frontmatter, links, refs
    sources:
      - ".github/workflows/skills-lint.sh"
      - ".github/workflows/skills-lint-test.sh"

ignore:
  # Not product: this repo's own lifecycle artifacts, produced BY the skills it ships.
  - "docs/**"
  - "tasks/**"
  # Config, not behaviour — the two shell scripts beside it are mapped above.
  - ".github/workflows/ci.yml"
  # The file shapes skills write. Data the skill emits, not logic: each template's owning
  # skill is mapped, and its spec describes the shape. Revisit if a template ever carries
  # behaviour its skill's prose does not state.
  - "**/templates/**"
  # Repo furniture — the project's own rulebook, licence, changelog and dotfiles. Normative
  # for contributors, but not a capability the product provides. `docs/**` is ignored on the
  # same reasoning.
  - "AGENTS.md"
  - "CLAUDE.md"
  - "README.md"
  - "CHANGELOG.md"
  - "LICENSE"
  - ".editorconfig"
  - ".gitattributes"
  - ".gitignore"
  - "**/*.tmp"
