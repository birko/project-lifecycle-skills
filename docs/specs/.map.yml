# docs/specs/.map.yml — capability → source map for the /specs skill.
# HAND-EDITABLE: this is the only human-owned file in docs/specs/.
# Spec bodies (<area>.md) are generated by /specs regen — don't hand-edit those.
#
# Granularity: one area = one capability a consumer would recognize
# (task-tracking, feature-lifecycle, spec-harvesting), not one file.
# Healthy: ~5-20 areas.
#
# SEEDED EMPTY on 2026-08-18. An empty `areas:` list is treated as *absent* at every
# enforcement point, so nothing false-fires while it is unfilled. Run `/specs init` to
# propose the area map, then `/specs regen` — tracked as EPIC-001 / STORY-008.

areas: []

ignore:
  - "docs/**"
  - "tasks/**"
  - ".github/**"
  - "**/templates/**"
  - "**/*.tmp"
