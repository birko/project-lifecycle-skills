# tasks/.config.yml — configuration for the /tasks skill.
# Generated by /tasks init (chained from /new-project). Safe to commit.

mode: local                    # local | hybrid

# Integration model. Default is pr-per-task: `pick` cuts task/TASK-NNN, `close` is the merge gate.
# Set `single-branch` for repos that commit straight to the default branch — then `pick` doesn't
# offer a branch and `close` skips its merge step instead of inferring the policy from the git log.
integration: single-branch     # pr-per-task | single-branch

# A GitHub remote exists (birko/project-lifecycle-skills) but mode is deliberately `local`:
# this epic is internal planning for a public repo whose Issues are better reserved for
# consumers reporting problems. Switch with `/tasks migrate` if that changes.
