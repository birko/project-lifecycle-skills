# docs/specs/.map.yml — capability → source map for the /specs skill.
# HAND-EDITABLE: this is the only human-owned file in docs/specs/.
# Spec bodies (<area>.md) are generated by /specs regen — don't hand-edit those.
#
# Granularity: one area = one capability a stakeholder would recognize
# (auth-session, bulk-filter-updates), not one class. Healthy: ~5–20 areas.

# Coverage stamps — written by EVERY /specs init run, so a fixed discovery clears a
# stale verdict by itself. See the skill's SKILL.md for the full rule.
#   coverage         verified | not-applicable (no behavioral code) | unverified
#                    Describes the map AS WRITTEN, i.e. after init step 4 reconciled
#                    what it found. Absent = predates the field = read as unverified.
#   tracked-files-at-scan  tree size when the scan ran. NOT a coverage numerator — the
#                    verdict is categorical and this file carries no percentage.
#                    Absent = no scan has run yet, which is why an unscanned map carries
#                    `unverified` and no companions: a render establishes nothing.
#   coverage-drift   the PATHS unmapped at first scan that turned out to be real source
#                    (folded into an area), as opposed to housekeeping sent to `ignore`.
#                    A list, never a tally: the classification is a judgement, and a bare
#                    count states it with the confidence of a measurement while leaving no
#                    trace of what was judged. [] = looked, found none. Absent = not computed.
coverage: unverified

areas:
  - name: example-capability          # kebab-case → docs/specs/example-capability.md
    title: Example capability
    sources:                          # globs, project-root-relative
      - src/Example*.cs

ignore:                               # never reported as unmapped
  - "**/bin/**"
  - "**/obj/**"
  - "**/node_modules/**"
  - "**/*.test.*"
  - "**/*Tests*/**"
