# docs/specs/.map.yml — capability → source map for the /specs skill.
# HAND-EDITABLE: this is the only human-owned file in docs/specs/.
# Spec bodies (<area>.md) are generated by /specs regen — don't hand-edit those.
#
# Granularity: one area = one capability a stakeholder would recognize
# (auth-session, bulk-filter-updates), not one class. Healthy: ~5–20 areas.

# coverage: did /specs init actually establish that these areas cover the sources?
#   verified | not-applicable (no behavioral code) | unverified (see init step 4)
# Written on EVERY init run, so a fixed discovery clears a stale verdict by itself.
# Absent = predates the key = treat as unverified.
coverage: verified

areas:
  - name: example-capability          # kebab-case → docs/specs/example-capability.md
    title: Example capability
    sources:                          # globs, project-root-relative
      - src/Example*.cs

ignore:                               # never reported as unmapped
  - "**/bin/**"
  - "**/obj/**"
  - "**/node_modules/**"
  - "**/*.test.*"
  - "**/*Tests*/**"
