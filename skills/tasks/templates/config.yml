# tasks/.config.yml — configuration for the /tasks skill.
# Generated by /tasks init (or by the first /tasks verb run, which falls back to init). Safe to commit.

mode: local                    # local | hybrid

# Integration model. Default is pr-per-task: `pick` cuts task/TASK-NNN, `close` is the merge gate.
# Set `single-branch` for repos that commit straight to the default branch — then `pick` doesn't
# offer a branch and `close` skips its merge step instead of inferring the policy from the git log.
# This is a declaration, so /tasks init only writes it once someone has actually chosen. The line
# ABSENT (this comment left in place) means undeclared: consumers apply the pr-per-task default and
# /adopt-project offers to backfill it. Never fill it in by guessing from `git log`.
# Fill the line below in only with a real answer — an arg the caller passed, or one a user gave.
# integration: <pr-per-task|single-branch>

# When mode: hybrid, fill in the external section:
# external:
#   provider: github             # github | jira
#   repo: owner/name             # github only
#   project: SUP                 # jira only (project key)
#   default-labels:
#     - agent-pickable

# Polyrepo scope — ONLY for a repo that sits in a family of sibling projects, each with its own
# `tasks/` tree. It declares WHERE the siblings are; it never lists which ones have tasks.
#   root:  the directory whose immediate children are the sibling projects, relative to this repo.
# The line ABSENT (this comment left in place) means "not a polyrepo", which is the normal case —
# every collection verb then behaves exactly as it does today. Absence is never a gap to fill.
# Only the `--across` switch reads this; without it nothing here changes any output.
# Scope is declared here because nothing in the repo determines it — a walk could stop one level up
# or at the drive root. Which siblings actually HAVE a tasks/ tree is probed fresh on every run and
# is deliberately not recorded here: a project that starts tracking tasks tomorrow must appear
# without anyone editing this file.
# siblings:
#   root: <relative path to the folder holding the sibling projects, e.g. ..>
